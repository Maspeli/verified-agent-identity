name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'ndis'
        required: true
        default: 'ndis'
      agent_description:
        description: 'ndis'
        required: true
        default: 'ndis AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 🔥 FIX: hanya install clawhub tanpa skill
      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Install script dependencies
        run: |
          cd scripts
          npm install

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js \
          --challenge "{\"name\": \"${{ github.event.inputs.agent_name }}\", \"description\": \"${{ github.event.inputs.agent_description }}\"}"
